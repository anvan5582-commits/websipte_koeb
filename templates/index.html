    <script>
        // Pre-load view preference to prevent flash
        document.addEventListener('DOMContentLoaded', function() {
            const savedView = localStorage.getItem('no_sync_view');
            if (savedView === 'compact') {
                const habitsContainer = document.getElementById('habitsContainer');
                const compactContainer = document.getElementById('compactViewContainer');
                if (habitsContainer && compactContainer) {
                    habitsContainer.style.display = 'none';
                    compactContainer.style.display = 'block';
                    compactContainer.classList.remove('hidden');
                }
            }
        });
    </script>
    <style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes bounce {
            0%, 20%, 53%, 80%, 100% { transform: translate3d(0,0,0); }
            40%, 43% { transform: translate3d(0, -30px, 0); }
            70% { transform: translate3d(0, -15px, 0); }
            90% { transform: translate3d(0, -4px, 0); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }
        
        .fade-in-up {
            animation: fadeInUp 0.6s ease-out;
        }
        
        .pulse-animation {
            animation: pulse 0.6s ease-in-out;
        }
        
        .bounce-animation {
            animation: bounce 1s ease-in-out;
        }
        
        .shake-animation {
            animation: shake 0.8s ease-in-out;
        }
        
        .streak-0 { background: linear-gradient(135deg, #6b7280, #9ca3af); }
        .streak-3 { background: linear-gradient(135deg, #ff6b6b, #ff8e8e); }
        .streak-7 { background: linear-gradient(135deg, #4ecdc4, #44a08d); }
        .streak-10 { background: linear-gradient(135deg, #45b7d1, #96c93d); }
        .streak-20 { background: linear-gradient(135deg, #667eea, #764ba2); }
        .streak-30 { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .streak-50 { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .streak-100 { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        
        .habit-card {
            transition: all 0.3s ease;
        }
        
        .habit-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .checkmark {
            transition: all 0.3s ease;
        }
        
        .checkmark:hover {
            transform: scale(1.1);
        }
        
        .modal {
            backdrop-filter: blur(5px);
        }

        /* GitHub-style contribution grid */
        .github-grid {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .contribution-day {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            border: 1px solid rgba(27, 31, 35, 0.06);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: 600;
            color: rgba(27, 31, 35, 0.6);
        }

        /* Hide day numbers on desktop */
        .contribution-day {
            color: transparent;
        }

        /* Mobile styles for contribution squares */
        @media (max-width: 768px) {
            .contribution-day {
                width: 20px;
                height: 20px;
                font-size: 10px;
                color: rgba(255, 255, 255, 0.9);
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
                font-weight: 700;
            }
            
            .github-grid {
                height: 190px!important; /* Increase height for mobile */
            }
        }
        
        .contribution-day:hover {
            border: 1px solid rgba(27, 31, 35, 0.3);
            transform: scale(1.1);
        }
        
        /* Activity levels */
        .activity-0 { background-color: #ebedf0; }
        .activity-1 { background-color: #9be9a8; }
        .activity-2 { background-color: #40c463; }
        .activity-3 { background-color: #30a14e; }
        .activity-4 { background-color: #216e39; }
        .activity-note { background-color: #f59e0b; } /* Orange for notes without completion */
        
        .month-label {
            font-size: 12px;
            font-weight: 500;
            color: #656d76;
            fill: #656d76;
        }

        /* Mobile styles for month labels */
        @media (max-width: 768px) {
            .month-label {
                font-size: 10px;
                font-weight: 600;
            }
        }
        
        .day-label {
            font-size: 11px;
            color: #656d76;
            fill: #656d76;
        }
        
        .contribution-tooltip {
            position: absolute;
            background: #24292f;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            z-index: 1000;
            white-space: nowrap;
            box-shadow: 0 8px 24px rgba(149, 157, 165, 0.2);
        }
        
        .contribution-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #24292f transparent transparent transparent;
        }
        

        
        .contribution-day.has-note::after {
            content: '';
            position: absolute;
            top: -2px;
            right: -2px;
            width: 4px;
            height: 4px;
            background: #1f6feb;
            border-radius: 50%;
            border: 1px solid white;
        }
        
        .contribution-day {
            position: relative;
        }
        
        .github-grid {
            width: 100%;
            min-width: 0;
            position: relative;
            height: 135px; /* Fixed height to contain the grid */
        }
        
        .grid-container {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: max-content;
        }

        /* Sticky weekday column so labels stay visible during horizontal scroll */
        .day-label-column {
            position: sticky;
            left: 0;
            background: #ffffff; /* match card background */
            z-index: 2;
            gap: 4px; /* desktop gap */
            width: 30px;
            height: 100%;
            justify-content: center;
            padding-top: 20px;
            padding-right: 5px;
        }

        .dark .day-label-column {
            background: #374151; /* dark card bg */
        }

        /* Mobile gap for day labels */
        @media (max-width: 768px) {
            .day-label {
                height: 20px !important;
                line-height: 20px !important;
            }
        }

        /* Desktop day label height */
        .day-label {
            height: 12px;
            line-height: 12px;
        }
        
        /* Ensure long habit names wrap nicely */
        .habit-card h3,
        .habit-card .habit-title {
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
        }
        
        /* Inline editing styles */
        .habit-title {
            cursor: pointer;
            transition: background-color 0.2s ease;
            padding: 2px 4px;
            border-radius: 4px;
            max-width: 300px; /* Prevent title from taking too much space */
        }
        
        .habit-title:hover {
            background-color: rgba(59, 130, 246, 0.1);
        }
        
        .habit-title-input {
            border: 2px solid #3b82f6;
            border-radius: 4px;
            padding: 2px 4px;
            font-size: 1.25rem;
            font-weight: 600;
            background: white;
            outline: none;
            max-width: 300px;
            min-width: 150px;
        }

        /* Dark mode styles - only applied when .dark class is present */
        .dark {
            color-scheme: dark;
        }

        .dark body {
            background: linear-gradient(135deg, #1f2937, #111827);
            color: #f9fafb;
        }

        .dark .bg-white {
            background-color: #374151 !important;
        }

        .dark .text-gray-800 {
            color: #f9fafb !important;
        }

        .dark .text-gray-600 {
            color: #d1d5db !important;
        }

        .dark .border-gray-300 {
            border-color: #4b5563 !important;
        }

        .dark .bg-gray-300 {
            background-color: #4b5563 !important;
        }

        .dark .text-gray-700 {
            color: #d1d5db !important;
        }

        .dark .hover\:bg-gray-400:hover {
            background-color: #6b7280 !important;
        }

        .dark input, .dark textarea {
            background-color: #4b5563 !important;
            color: #f9fafb !important;
        }

        .dark .habit-title:hover {
            background-color: rgba(59, 130, 246, 0.2);
        }

        .dark .habit-title-input {
            background-color: #4b5563;
            color: #f9fafb;
        }

        /* Dark mode GitHub grid */
        .dark .activity-0 { background-color: #161b22; }
        .dark .activity-1 { background-color: #4ade80; }
        .dark .activity-2 { background-color: #22c55e; }
        .dark .activity-3 { background-color: #16a34a; }
        .dark .activity-4 { background-color: #15803d; }
        .dark .activity-note { background-color: #f59e0b; }

        .dark .contribution-day {
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dark .contribution-day:hover {
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .dark .month-label,
        .dark .day-label {
            color: #8b949e;
        }

        /* Mobile dark mode month labels */
        @media (max-width: 768px) {
            .dark .month-label {
                color: #8b949e;
            }
        }



        .dark .contribution-tooltip {
            background: #f6f8fa;
            color: #24292f;
        }

        .dark .contribution-tooltip::after {
            border-color: #f6f8fa transparent transparent transparent;
        }

        .dark .contribution-day.has-note::after {
            background: #58a6ff;
            border: 1px solid #0d1117;
        }

        .dark .contribution-day {
            color: transparent;
        }

        /* Mobile dark mode styles */
        @media (max-width: 768px) {
            .dark .contribution-day {
                color: rgba(255, 255, 255, 0.9);
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
                font-weight: 700;
            }
        }

        /* Dark mode current day border override */
        .dark .contribution-day[style*="border: 1px solid #1f2937"] {
            border: 1px solid #f3f4f6 !important;
        }

        /* Theme toggle button */
        .theme-toggle {
            background: #e5e7eb;
            border: none;
            border-radius: 20px;
            width: 40px;
            height: 20px;
            cursor: pointer;
            position: relative;
        }

        .dark .theme-toggle {
            background: #4b5563;
        }

        .theme-toggle-slider {
            background: white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            position: absolute;
            top: 2px;
            left: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
        }

        .dark .theme-toggle-slider {
            transform: translateX(20px);
            background: #1f2937;
        }

        .theme-toggle-slider i {
            color: #fbbf24;
        }

        .dark .theme-toggle-slider i {
            color: #fbbf24;
        }

        /* Dark mode streak colors */
        .dark .streak-0 { background: linear-gradient(135deg, #4b5563, #6b7280); }

        /* Compact view styles */
        .compact-wrapper {
            display: flex;
            overflow: hidden;
        }

        .compact-names-column {
            flex-shrink: 0;
            border-right: 1px solid #e5e7eb;
            min-width: 100px;
            max-width: 250px;
        }

        .compact-grid-column {
            flex: 1;
            overflow-x: auto;
        }

        .compact-names-header {
            font-weight: 600;
            color: #374151;
            padding: 12px 16px;
            border-bottom: 1px solid #e5e7eb;
            height: 60px;
            display: flex;
            align-items: center;
            background-color: transparent;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .compact-habit-name {
            text-align: left;
            font-weight: 600;
            color: #374151;
            word-wrap: break-word;
            padding: 12px 16px;
            border-bottom: 1px solid #e5e7eb;
            height: 48px;
            display: flex;
            align-items: center;
        }

        .compact-grid-header {
            display: flex;
        }

        .compact-day-header {
            font-size: 10px;
            color: #6b7280;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            height: 60px;
            display: flex;
            border-top: 1px solid #e5e7eb;
            align-items: center;
            justify-content: center;
            padding: 4px 8px;
            white-space: nowrap;
            min-width: 32px;
            font-weight: 600;
        }

        .compact-grid-row {
            display: flex;
        }

        .compact-grid-cell {
            width: 16px;
            height: 16px;
            border-radius: 2px;
            border: 1px solid rgba(27, 31, 35, 0.06);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .compact-grid-cell:hover {
            border: 1px solid rgba(27, 31, 35, 0.3);
            transform: scale(1.2);
        }

        .compact-grid-cell.has-note::after {
            content: '';
            position: absolute;
            top: -1px;
            right: -1px;
            width: 3px;
            height: 3px;
            background: #1f6feb;
            border-radius: 50%;
            border: 1px solid white;
        }

        .compact-grid-cell-wrapper {
            height: 48px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
            padding: 0 8px;
        }

        /* Dark mode compact view */
        .dark .compact-names-column {
            border-right-color: #4b5563;
        }

        .dark .compact-names-header {
            color: #f9fafb;
            border-bottom-color: #4b5563;
        }

        .dark .compact-habit-name {
            color: #f9fafb;
            border-bottom-color: #4b5563;
        }

        .dark .compact-grid-header {
            border-bottom-color: #4b5563;
        }

        .dark .compact-day-header {
            color: #9ca3af;
            border-top: 1px solid #4b5563;
        }

        .dark .compact-grid-cell-wrapper {
            border-bottom-color: #4b5563;
        }

        .dark .compact-grid-cell {
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dark .compact-grid-cell:hover {
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .dark .compact-grid-cell.has-note::after {
            background: #58a6ff;
            border: 1px solid #0d1117;
        }

        /* Dark mode view toggle */
        .dark .bg-gray-100 {
            background-color: #4b5563 !important;
        }

        .dark .text-gray-700 {
            color: #e5e7eb !important;
        }

        .dark .border-gray-300 {
            border-color: #6b7280 !important;
        }

        .dark .hover\:bg-gray-200:hover {
            background-color: #6b7280 !important;
        }

        .dark .text-gray-600 {
            color: #d1d5db !important;
        }

        /* Drag and drop styles */
        .compact-habit-name {
            cursor: grab;
            user-select: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .compact-habit-name:active {
            cursor: grabbing;
        }

        .drag-handle {
            color: #9ca3af;
            font-size: 12px;
            cursor: grab;
            transition: color 0.2s ease;
        }

        .compact-habit-name:hover .drag-handle {
            color: #6b7280;
        }

        .compact-habit-name:active .drag-handle {
            cursor: grabbing;
        }

        .habit-name-text {
            flex: 1;
            word-wrap: break-word;
        }

        .compact-habit-name.dragging {
            opacity: 0.5;
            transform: rotate(5deg);
        }

        .compact-habit-name.drag-over {
            border-top: 2px solid #3b82f6;
            background-color: rgba(59, 130, 246, 0.1);
        }

        .compact-grid-row {
            transition: all 0.2s ease;
        }

        .compact-grid-row.dragging {
            opacity: 0.5;
        }

        .compact-grid-row.drag-over {
            border-top: 2px solid #3b82f6;
            background-color: rgba(59, 130, 246, 0.1);
        }

        /* Dark mode drag and drop */
        .dark .compact-habit-name.drag-over {
            border-top-color: #60a5fa;
            background-color: rgba(96, 165, 250, 0.2);
        }

        .dark .compact-grid-row.drag-over {
            border-top-color: #60a5fa;
            background-color: rgba(96, 165, 250, 0.2);
        }

        /* macOS-style scrollbar for github-grid */
        .github-grid {
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE and Edge */
        }

        .github-grid::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        /* Dark mode drag handle */
        .dark .drag-handle {
            color: #6b7280;
        }

        .dark .compact-habit-name:hover .drag-handle {
            color: #9ca3af;
        }
    </style>

yle><style>

<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen" style="font-family: &quot;Inter&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, sans-serif; padding-top: 48px;">
    <div id="app" class="container mx-auto px-4 py-6 max-w-4xl">
        <!-- Header -->
        <div class="text-center mb-6 fade-in-up">
            <div class="flex items-center justify-center gap-4 mb-1">
                <h1 class="text-3xl font-bold text-gray-800">
                    <i class="fas fa-fire text-orange-500 mr-2"></i>
                    Трекер звичок
                 </h1>
                <button class="theme-toggle" onclick="toggleTheme()" title="Увімкнути/вимкнути темний режим">
                    <div class="theme-toggle-slider">
                        <i class="fas fa-sun"></i>
                    </div>
                </button>
            </div>
            <p class="text-gray-600 text-sm">Формуйте кращі звички, день за днем </p>
        </div>

        <!-- Add Habit Form -->
        <div class="bg-white rounded-md shadow-lg p-4 mb-6 fade-in-up">
            <div class="flex flex-col md:flex-row gap-3 items-center">
                <div class="hidden md:flex items-center gap-2 flex-shrink-0">
                    <i class="fas fa-plus-circle text-green-500"></i>
                    <span class="text-lg font-semibold text-gray-800">Додати звичку: </span>
                </div>
                <input type="text" id="habitName" placeholder="Введіть назву звички (наприклад, Фізичні вправи, Читання, Медитація)" class="w-full md:flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
                <button onclick="addHabit()" class="w-full md:w-auto px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors font-semibold flex items-center justify-center">
                    <i class="fas fa-plus mr-1"></i>
                    Додати
                 </button>
            </div>
        </div>

        <!-- View Toggle -->
        <div class="flex justify-end mb-4">
            <div class="flex items-center gap-3">
                <span class="text-sm text-gray-600">Перегляд: </span>
                <button id="viewToggle" onclick="toggleView()" class="text-sm px-2 py-1 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors font-medium flex items-center justify-center border border-gray-300" title="Перемикання між картковим та компактним режимом перегляду">
                    <i class="fas fa-th-large mr-2"></i>
                    <span id="viewToggleText">Компактний вигляд </span>
                </button>
            </div>
        </div>

        <!-- Habits List -->
        <div id="habitsContainer" class="space-y-4" style="display: block;"></div>

        <!-- Compact View -->
        <div id="compactViewContainer" class="hidden" style="display: none;">
            <div class="bg-white rounded-md shadow-lg p-4 mb-4">
                <div id="compactTable" class="overflow-x-auto">
                    <!-- Compact table will be generated here -->
                </div>
            </div>
        </div>


    </div>

    <!-- Note Modal -->
    <div id="noteModal" class="fixed inset-0 bg-black bg-opacity-50 modal hidden z-50 flex items-center justify-center">
        <div class="bg-white rounded-lg p-6 w-full max-w-md mx-4">
            <h3 class="text-xl font-semibold text-gray-800 mb-4">Add Note</h3>
            <textarea id="noteText" placeholder="How was your day? Any thoughts about this habit?" class="w-full h-32 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none resize-none"></textarea>
            <div class="flex gap-3 mt-4">
                <button onclick="saveNote()" class="flex-1 px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors">
                    Save Note
                </button>
                <button onclick="closeNoteModal()" class="flex-1 px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition-colors">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- Confetti Canvas -->
    <canvas id="confetti-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999;"></canvas>

    <script>
        let habits = JSON.parse(localStorage.getItem('habits')) || [];
        let habitOrder = JSON.parse(localStorage.getItem('habitOrder')) || [];
        let currentHabitId = null;
        let currentDate = null; // Track the selected date for notes
        let confetti = null;
        let tooltip = null;
        let isCompactView = false; // Track current view mode
        let draggedHabitId = null;

        // Theme management
        function initTheme() {
            const savedTheme = localStorage.getItem('no_sync_theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
                updateToggleIcon(true);
            } else {
                document.documentElement.classList.remove('dark');
                updateToggleIcon(false);
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            
            if (isDark) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('no_sync_theme', 'light');
                updateToggleIcon(false);
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('no_sync_theme', 'dark');
                updateToggleIcon(true);
            }
        }

        function updateToggleIcon(isDark) {
            const icon = document.querySelector('.theme-toggle-slider i');
            if (isDark) {
                icon.className = 'fas fa-moon';
            } else {
                icon.className = 'fas fa-sun';
            }
        }

        // View preferences management
        function initViewPreferences() {
            // Only load saved view preference
            const savedView = localStorage.getItem('no_sync_view');
            if (savedView === 'compact') {
                isCompactView = true;
                updateToggleButtonState();
                updateCompactView();
            } else {
                isCompactView = false;
                setCardView();
            }
        }

        function updateToggleButtonState() {
            const toggleButton = document.getElementById('viewToggle');
            const toggleText = document.getElementById('viewToggleText');
            const toggleIcon = toggleButton.querySelector('i');

            if (isCompactView) {
                toggleText.textContent = 'Card View';
                toggleIcon.className = 'fas fa-list mr-2';
                toggleButton.className = 'text-sm px-2 py-1 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors font-medium flex items-center justify-center border border-blue-500';
            } else {
                toggleText.textContent = 'Compact View';
                toggleIcon.className = 'fas fa-th-large mr-2';
                toggleButton.className = 'text-sm px-2 py-1 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors font-medium flex items-center justify-center border border-gray-300';
            }
        }

        function saveViewPreference() {
            localStorage.setItem('no_sync_view', isCompactView ? 'compact' : 'card');
        }

        // Initialize confetti and tooltip
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize theme first
            initTheme();
            
            // Initialize view preferences
            initViewPreferences();
            
            const canvas = document.getElementById('confetti-canvas');
            confetti = new ConfettiGenerator({
                target: canvas,
                max: 80,
                size: 1.2,
                animate: true,
                props: ['circle', 'square', 'triangle', 'line'],
                colors: [[165, 104, 246], [230, 61, 135], [0, 199, 190], [253, 214, 126]],
                clock: 25,
                rotate: true,
                start_from_edge: false,
                respawn: true
            });
            
            // Create tooltip element
            tooltip = document.createElement('div');
            tooltip.className = 'contribution-tooltip';
            tooltip.style.display = 'none';
            document.body.appendChild(tooltip);
            
            // Initialize overlay scrollbars for github-grid elements
            initOverlayScrollbars();
        });

        function addHabit() {
            const habitName = document.getElementById('habitName').value.trim();
            if (!habitName) {
                alert('Please enter a habit name');
                return;
            }

            const habit = {
                id: Date.now(),
                name: habitName,
                dates: {},
                streak: 0,
                longestStreak: 0,
                createdAt: new Date().toISOString()
            };

            habits.push(habit);
            habitOrder.push(habit.id); // Add to order array
            saveHabits();
            saveHabitOrder();
            renderHabits();
            
            // Update compact view if it's currently active
            if (isCompactView) {
                updateCompactView();
            }
            
            document.getElementById('habitName').value = '';
        }

        function toggleHabit(habitId, date) {
            const habit = habits.find(h => h.id === habitId);
            if (!habit) return;

            const previousStreak = habit.streak; // Store previous streak for milestone checking

            if (habit.dates[date]) {
                // Toggle the checked status while preserving the note
                const existingNote = habit.dates[date].note || '';
                const wasChecked = habit.dates[date].checked;
                
                if (wasChecked) {
                    // Uncheck - but preserve the note if it exists
                    if (existingNote) {
                        // Keep the date entry but mark as unchecked
                        habit.dates[date] = {
                            checked: false,
                            note: existingNote,
                            timestamp: new Date().toISOString()
                        };
                    } else {
                        // If no note, remove the entry completely
                        delete habit.dates[date];
                    }
                } else {
                    // Check - preserve the note
                    habit.dates[date] = {
                        checked: true,
                        note: existingNote,
                        timestamp: new Date().toISOString()
                    };
                }
            } else {
                // Check - create new entry
                habit.dates[date] = {
                    checked: true,
                    note: '',
                    timestamp: new Date().toISOString()
                };
            }

            // Recalculate streak after any change
            habit.streak = calculateStreak(habit.dates);

            // Update longest streak if current streak is higher
            if (habit.streak > habit.longestStreak) {
                habit.longestStreak = habit.streak;
            }

            // Check for milestone only when checking and streak increased
            const wasJustChecked = habit.dates[date]?.checked;
            if (wasJustChecked && habit.streak > previousStreak) {
                checkMilestone(habit);
            }

            saveHabits();
            updateHabitDisplay(habit);
        }

        function calculateStreak(dates) {
            let streak = 0;
            const today = new Date();
            
            // Start from today and go backwards
            for (let i = 0; i < 365; i++) { // Max 1 year to prevent infinite loops
                const checkDate = new Date(today);
                checkDate.setDate(today.getDate() - i);
                const dateStr = checkDate.toISOString().split('T')[0];
                
                if (dates[dateStr] && dates[dateStr].checked === true) {
                streak++;
                } else {
                    // If we encounter a day that's not checked, stop counting
                    break;
                }
            }

            return streak;
        }

        function checkMilestone(habit) {
            const milestones = [3, 7, 14, 30, 60, 180, 365]; // 3 days, 7 days, 14 days, 30 days, 60 days, 6 months, 1 year
            
            // Only celebrate if we just reached a milestone (check if previous streak was one less)
            if (milestones.includes(habit.streak)) {
                showMilestoneAnimation(habit.streak);
            }
        }

        function showMilestoneAnimation(streak) {
            // Start confetti
            confetti.render();
            
            // Get appropriate message for milestone
            let message = '';
            switch(streak) {
                case 3: message = '3-day streak! Great start! 🌟'; break;
                case 7: message = '1 week streak! You\'re on fire! 🔥'; break;
                case 14: message = '2 weeks streak! Building momentum! ⚡'; break;
                case 30: message = '1 month streak! Incredible dedication! 💪'; break;
                case 60: message = '2 months streak! You\'re unstoppable! 🚀'; break;
                case 180: message = '6 months streak! Habit master! 👑'; break;
                case 365: message = '1 YEAR streak! Legendary achievement! 🏆'; break;
                default: message = `${streak}-day streak achieved! 🎉`; break;
            }
            
            // Show notification
            const notification = document.createElement('div');
            notification.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-4 rounded-lg shadow-lg z-50 fade-in-up';
            notification.innerHTML = `
                <div class="flex items-center">
                    <i class="fas fa-trophy text-yellow-300 mr-3 text-xl"></i>
                    <div>
                        <div class="font-bold">Congratulations!</div>
                        <div>${message}</div>
                    </div>
                </div>
            `;
            document.body.appendChild(notification);

            // Remove notification and clear confetti after 5 seconds
            setTimeout(() => {
                notification.remove();
                confetti.clear();
            }, 5000);
        }

        function addNote(habitId, date) {

        function saveNote() {

        function editHabitTitle(habitId, element) {
            const originalText = element.textContent;
            const input = document.createElement('input');

            input.value = originalText;
            input.className = 'habit-title-input';
            input.style.width = Math.min(300, Math.max(150, element.offsetWidth)) + 'px';
            
            // Replace the span with input
            element.style.display = 'none';
            element.parentNode.insertBefore(input, element.nextSibling);
            
            // Focus and select all text
            input.focus();
            input.select();
            
            // Handle saving
            const saveTitle = () => {
                const newTitle = input.value.trim();
                if (newTitle && newTitle !== originalText) {
                    const habit = habits.find(h => h.id === habitId);
                    if (habit) {
                        habit.name = newTitle;
                        saveHabits();
                        renderHabits();
                    }
                } else {
                    // Restore original if cancelled or empty
                    input.remove();
                    element.style.display = '';
                }
            };
            
            // Handle canceling
            const cancelEdit = () => {
                input.remove();
                element.style.display = '';
            };
            
            // Event listeners
            input.addEventListener('blur', saveTitle);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    saveTitle();
                } else if (e.key === 'Escape') {

                    cancelEdit();
                }
            });

                function generateGitHubGrid(habit) {
            const today = new Date();
            // Responsive square size (desktop 12px, mobile 20px)
            const isMobile = window.innerWidth <= 768;
            const squareSize = isMobile ? 20 : 12;
            
            // Generate a large grid (2 years back from today)
            const endDate = new Date(today);
            const totalDays = 365 * 2; // 2 years of data
            const startDate = new Date(today);
            startDate.setDate(today.getDate() - totalDays + 1);
            
            // Find the start of the week containing startDate
            const gridStartDate = new Date(startDate);
            gridStartDate.setDate(startDate.getDate() - startDate.getDay());
            
            const weeks = [];
            const months = [];
            let currentWeek = [];
            let currentDate = new Date(gridStartDate);
            let weekIndex = 0;
            let lastMonth = -1;
            
            // Generate weeks until we've covered today
            while (currentDate <= endDate || currentWeek.length > 0) {
                // Track month labels - show at the start of each month
                if (currentDate.getMonth() !== lastMonth && currentDate.getDay() === 0) {
                    const monthName = currentDate.toLocaleDateString('en-US', { month: 'short' });
                    months.push({
                        name: monthName,
                        weekIndex: weekIndex
                    });
                    lastMonth = currentDate.getMonth();
                }
                
                const dateStr = currentDate.toISOString().split('T')[0];
                const activity = getActivityLevel(habit, dateStr, true);
                const isToday = dateStr === today.toISOString().split('T')[0];
                const hasNote = habit.dates[dateStr]?.note;
                
                currentWeek.push({
                    date: dateStr,
                    activity: activity,
                    isToday: isToday,
                    hasNote: hasNote,
                    dayOfMonth: currentDate.getDate(),
                    displayDate: currentDate.toLocaleDateString('en-US', { 
                        weekday: 'short', 
                        month: 'short', 
                        day: 'numeric',
                        year: 'numeric' 
                    })
                });
                
                if (currentWeek.length === 7) {
                    weeks.push([...currentWeek]);
                    currentWeek = [];
                    weekIndex++;
                }
                
                currentDate.setDate(currentDate.getDate() + 1);
                
                // Stop if we've gone past today
                if (currentDate > endDate && currentWeek.length === 0) break;
            }
            
            // Add any remaining partial week
            if (currentWeek.length > 0) {
                // Fill the rest of the week with empty days if needed
                while (currentWeek.length < 7) {
                    currentWeek.push({
                        date: '',
                        activity: 0,
                        isToday: false,
                        hasNote: false,
                        displayDate: ''
                    });
                }
                weeks.push(currentWeek);
            }
            
            // Build the grid HTML
            let gridHTML = '';
            
            // Month labels
            gridHTML += '<div class="relative mb-2" style="margin-left: 0; height: 16px;">';
            months.forEach((month, index) => {
                // Offset month label according to square size (desktop vs mobile)
                const gap = 4;
                const leftOffset = month.weekIndex * (squareSize + gap);
                gridHTML += `<div class="month-label absolute" style="left: ${leftOffset}px;">${month.name}</div>`;
            });
            gridHTML += '</div>';
            
            // Grid container
            gridHTML += '<div class="flex" style="margin-left: 0;">';
            
            // Contribution grid
            gridHTML += '<div class="flex gap-1">';
            weeks.forEach(week => {
                gridHTML += '<div class="flex flex-col gap-1">';
                week.forEach(day => {
                    if (day.date === '') {
                        // Empty day placeholder (maintain spacing)
                        gridHTML += `<div style="width: ${squareSize}px; height: ${squareSize}px;"></div>`;
                    } else {
                        const hasNoteClass = day.hasNote ? 'has-note' : '';
                        const activityClass = day.activity === 'note' ? 'activity-note' : `activity-${day.activity}`;
                        gridHTML += `
                            <div 
                                class="contribution-day ${activityClass} ${day.isToday ? 'today' : ''} ${hasNoteClass}"
                                data-date="${day.date}"
                                data-habit-id="${habit.id}"
                                data-activity="${day.activity}"
                                data-display-date="${day.displayDate}"
                                data-has-note="${day.hasNote ? 'true' : 'false'}"
                                onclick="toggleHabit(${habit.id}, '${day.date}')"
                                oncontextmenu="addNote(${habit.id}, '${day.date}'); return false;"
                                onmouseenter="showTooltip(event, this)"
                                onmouseleave="hideTooltip()"
                                style="${day.isToday ? 'border: 1px solid #1f2937;' : ''}"
                            >${day.dayOfMonth}</div>
                        `;
                    }
                });
                gridHTML += '</div>';
            });
            gridHTML += '</div>';
            gridHTML += '</div>';
            

            
            return gridHTML;
        }
        
                function getActivityLevel(habit, dateStr, isCurrentYear) {
            const entry = habit.dates[dateStr];
            if (!entry) return 0;

            // Special case: has note but not completed - return 'note' for orange styling
            if (!entry.checked && entry.note && entry.note.trim().length > 0) {
                return 'note';
            }

            // If not checked, return 0
            if (!entry.checked) return 0;

            // Calculate streak length up to this date
            const streakLength = calculateStreakAtDate(habit.dates, dateStr);
            
            // Base activity level starts at 1 for completed day
            let level = 1;

            // Bonus for having notes
            if (entry.note && entry.note.trim().length > 0) {
                level = Math.min(level + 1, 4);
            }

            // Adjust level based on streak length at this date
            if (streakLength >= 30) {
                level = Math.min(level + 3, 4); // Very long streaks
            } else if (streakLength >= 14) {
                level = Math.min(level + 2, 4); // 2+ week streaks
            } else if (streakLength >= 7) {
                level = Math.min(level + 1, 4); // 1+ week streaks
            } else if (streakLength >= 3) {
                level = Math.min(level + 1, 4); // 3+ day streaks
            }

            return Math.min(level, 4);
        }

        function calculateStreakAtDate(dates, targetDateStr) {
            const targetDate = new Date(targetDateStr);
            let streak = 0;
            
            // Start from target date and go backwards
            for (let i = 0; i < 365; i++) { // Max 1 year to prevent infinite loops
                const checkDate = new Date(targetDate);
                checkDate.setDate(targetDate.getDate() - i);
                const dateStr = checkDate.toISOString().split('T')[0];
                
                if (dates[dateStr] && dates[dateStr].checked === true) {
                    streak++;
                } else {
                    // If we encounter a day that's not checked, stop counting
                    break;
                }
            }

            return streak;
        }

        function getSortedHabits() {
            // If we have a custom order, use it; otherwise use default order
            if (habitOrder.length > 0) {
                // Create a map for quick lookup
                const habitMap = new Map(habits.map(h => [h.id, h]));
                const sortedHabits = [];
                
                // Add habits in custom order
                for (const habitId of habitOrder) {
                    const habit = habitMap.get(habitId);
                    if (habit) {
                        sortedHabits.push(habit);
                    }
                }
                
                // Add any habits that aren't in the order array (new habits)
                for (const habit of habits) {
                    if (!habitOrder.includes(habit.id)) {
                        sortedHabits.push(habit);
                    }
                }
                
                return sortedHabits;
            }
            
            // Default order (by creation date)
            return [...habits].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
        }

        function updateCompactView() {

            const isMobile = window.innerWidth <= 768;
            const squareSize = isMobile ? 20 : 12;
            
            const days = [];
            
            // Generate the last 30 days
            for (let i = 29; i >= 0; i--) { // Changed to 29 for last 30 days
                const date = new Date(today);
                date.setDate(today.getDate() - i);
                days.push({
                    date: date.toISOString().split('T')[0],
                    display: date.toLocaleDateString('en-US', { 
                        month: 'short', 
                        day: 'numeric' 
                    }),
                    fullDisplay: date.toLocaleDateString('en-US', { 
                        weekday: 'short', 
                        month: 'short', 
                        day: 'numeric',
                        year: 'numeric'

            const sortedHabits = getSortedHabits();

            let html = '<div class="compact-wrapper">';
            
            // Names column (fixed)
            html += '<div class="compact-names-column">';
            html += '<div class="compact-names-header">Habit</div>';
            sortedHabits.forEach(habit => {
                html += `<div class="compact-habit-name" draggable="true" data-habit-id="${habit.id}">
                    <i class="fas fa-grip-vertical drag-handle"></i>
                    <span class="habit-name-text">${habit.name}</span>
                </div>`;
            });
            html += '</div>';
            
            // Grid column (scrollable)
            html += '<div class="compact-grid-column">';
            
            // Header row with day labels
            html += '<div class="compact-grid-header">';
            days.forEach(day => {
                html += `<div class="compact-day-header">${day.display}</div>`;
            });
            html += '</div>';
            
            // Body rows for each habit
            sortedHabits.forEach(habit => {
                html += '<div class="compact-grid-row" data-habit-id="${habit.id}">';
                
                days.forEach(day => {
                    const activity = getCompactActivityLevel(habit, day.date);
                    const hasNote = habit.dates[day.date]?.note && habit.dates[day.date].note.trim().length > 0;
                    const isToday = day.date === today.toISOString().split('T')[0];
                    
                    const activityClass = activity === 'note' ? 'activity-note' : `activity-${activity}`;
                    const hasNoteClass = hasNote ? 'has-note' : '';
                    const todayStyle = isToday ? 'border: 1px solid #1f2937;' : '';
                    
                    html += `
                        <div class="compact-grid-cell-wrapper">
                            <div 
                                class="compact-grid-cell ${activityClass} ${hasNoteClass}"
                                onclick="toggleHabit(${habit.id}, '${day.date}')"
                                oncontextmenu="addNote(${habit.id}, '${day.date}'); return false;"
                                onmouseenter="showCompactTooltip(event, this, '${day.fullDisplay}', '${activity}', ${hasNote})"
                                onmouseleave="hideTooltip()"
                                style="${todayStyle}"
                                data-date="${day.date}"
                                data-habit-id="${habit.id}"
                            ></div>
                        </div>
                    `;
                });
                
                html += '</div>';
            });
            html += '</div>'; // end grid column
            html += '</div>'; // end wrapper
            
            tableContainer.innerHTML = html;

            // After rendering, restore previous scroll position if any; otherwise scroll to show current day (end)
            const newGridColumn = tableContainer.querySelector('.compact-grid-column');
            if (newGridColumn) {
                if (previousScrollLeft !== null) {
                    newGridColumn.scrollLeft = previousScrollLeft;
                } else {
                    // scrollWidth may not be fully set immediately; delay to next frame
                    requestAnimationFrame(() => {
                        newGridColumn.scrollLeft = newGridColumn.scrollWidth;
                    });
                }
            }
            
            // Setup drag and drop after rendering
            setupDragAndDrop();
        }

        function getCompactActivityLevel(habit, dateStr) {
            const entry = habit.dates[dateStr];
            if (!entry) return 0;

            // Special case: has note but not completed - return 'note' for orange styling
            if (!entry.checked && entry.note && entry.note.trim().length > 0) {
                return 'note';
            }

            // If not checked, return 0
            if (!entry.checked) return 0;

            // Calculate streak length up to this date (same as main view)
            const streakLength = calculateStreakAtDate(habit.dates, dateStr);
            
            // Base activity level starts at 1 for completed day
            let level = 1;

            // Bonus for having notes
            if (entry.note && entry.note.trim().length > 0) {
                level = Math.min(level + 1, 4);
            }

            // Adjust level based on streak length at this date (same as main view)
            if (streakLength >= 30) {
                level = Math.min(level + 3, 4); // Very long streaks
            } else if (streakLength >= 14) {
                level = Math.min(level + 2, 4); // 2+ week streaks
            } else if (streakLength >= 7) {
                level = Math.min(level + 1, 4); // 1+ week streaks
            } else if (streakLength >= 3) {
                level = Math.min(level + 1, 4); // 3+ day streaks
            }

            return Math.min(level, 4);
        }

        function showCompactTooltip(event, element, date, activity, hasNote) {
            // Don't show tooltip on mobile devices
            if (window.innerWidth <= 768) {
                return;
            }
            
            const habitId = element.dataset.habitId;
            const habit = habits.find(h => h.id == habitId);
            const dateStr = element.dataset.date;
            const entry = habit.dates[dateStr];
            
            let tooltipText = '';
            if (entry && entry.checked) {
                tooltipText = `Completed on ${date}`;
                if (hasNote) {
                    tooltipText += ' (has note)';
                }
            } else if (hasNote) {
                tooltipText = `Note added on ${date}`;
            } else if (activity === 'note') {
                tooltipText = `Note only on ${date}`;
            } else {
                tooltipText = `No activity on ${date}`;
            }
            
            tooltip.textContent = tooltipText;
            tooltip.style.display = 'block';
            
            const rect = element.getBoundingClientRect();
            tooltip.style.left = rect.left + rect.width / 2 - tooltip.offsetWidth / 2 + 'px';
            tooltip.style.top = rect.top - tooltip.offsetHeight - 8 + 'px';
        }

        // Overlay scrollbars initialization
        function initOverlayScrollbars() {
            if (typeof OverlayScrollbars === 'undefined') {
                console.warn('OverlayScrollbars not loaded');
                return;
            }

            const osOptions = {
                scrollbars: {
                    theme: 'os-theme-light',
                    autoHide: 'leave', // Changed to 'leave' for hover effect
                    autoHideDelay: 800,
                    autoHideSuspend: false,
                    dragScroll: true,
                    clickScroll: true,
                    scrolls: 'both'
                },
                overflow: {
                    x: 'scroll',
                    y: 'hidden'
                }
            };

            // Initialize for existing github-grid elements
            document.querySelectorAll('.github-grid').forEach(grid => {
                OverlayScrollbars(grid, osOptions);
            });
        }

        // Function to initialize overlay scrollbars for new elements
        function initOverlayScrollbarsForElement(element) {
            if (typeof OverlayScrollbars === 'undefined') {
                return;
            }

            const osOptions = {
                scrollbars: {
                    theme: 'os-theme-light',
                    autoHide: 'leave', // Changed to 'leave' for hover effect
                    autoHideDelay: 800,
                    autoHideSuspend: false,
                    dragScroll: true,
                    clickScroll: true,
                    scrolls: 'both'
                },
                overflow: {
                    x: 'scroll',
                    y: 'hidden'
                }
            };

            OverlayScrollbars(element, osOptions);
        }

        // Drag and drop functionality
        function setupDragAndDrop() {
            const compactTable = document.getElementById('compactTable');
            if (!compactTable) return;

            // Add event listeners to habit names
            const habitNames = compactTable.querySelectorAll('.compact-habit-name');
            habitNames.forEach(habitName => {
                habitName.addEventListener('dragstart', handleDragStart);
                habitName.addEventListener('dragend', handleDragEnd);
                habitName.addEventListener('dragover', handleDragOver);
                habitName.addEventListener('drop', handleDrop);
                habitName.addEventListener('dragenter', handleDragEnter);
                habitName.addEventListener('dragleave', handleDragLeave);
            });
        }

        function handleDragStart(e) {
            draggedHabitId = parseInt(e.target.dataset.habitId);
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', e.target.outerHTML);
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            // Remove drag-over classes from all elements
            document.querySelectorAll('.compact-habit-name, .compact-grid-row').forEach(el => {
                el.classList.remove('drag-over');
            });
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDragEnter(e) {
            e.preventDefault();
            e.target.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.target.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            const targetHabitId = parseInt(e.target.dataset.habitId);
            
            if (draggedHabitId && targetHabitId && draggedHabitId !== targetHabitId) {
                // Reorder the habitOrder array
                const draggedIndex = habitOrder.indexOf(draggedHabitId);
                const targetIndex = habitOrder.indexOf(targetHabitId);
                
                if (draggedIndex !== -1 && targetIndex !== -1) {
                    // Remove dragged item from its current position
                    habitOrder.splice(draggedIndex, 1);
                    // Insert at target position
                    habitOrder.splice(targetIndex, 0, draggedHabitId);
                    
                    // Save the new order
                    saveHabitOrder();
                    
                    // Update the compact view to reflect the new order
                    updateCompactView();
                }
            }
            
            // Clean up
            draggedHabitId = null;
            e.target.classList.remove('drag-over');
        }
    </script>
