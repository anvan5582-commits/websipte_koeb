<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер звичок</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link href="/static/css2.css" rel="stylesheet">
    <link href="/static/all.min.css" rel="stylesheet">
    <link href="/static/overlayscrollbars.min.css" rel="stylesheet">

    <style>
        /* Я залишив ваші анімації та стилі карток тут, 
           щоб не роздувати папку static додатковими файлами */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up { animation: fadeInUp 0.6s ease-out; }
        .habit-card { transition: all 0.3s ease; }
        .habit-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        /* GitHub Grid Styles */
        .github-grid { font-family: sans-serif; position: relative; height: 135px; overflow-x: auto; }
        .activity-0 { background-color: #ebedf0; }
        .activity-1 { background-color: #9be9a8; }
        .activity-2 { background-color: #40c463; }
        .activity-3 { background-color: #30a14e; }
        .activity-4 { background-color: #216e39; }
        
        /* Dark Mode */
        .dark body { background: #111827; color: white; }
        .dark .bg-white { background-color: #374151 !important; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-4">

    <div class="container mx-auto max-w-4xl">
        <header class="flex justify-between items-center mb-8 fade-in-up">
            <h1 class="text-3xl font-bold text-gray-800">Мій Трекер Звичок</h1>
            <button id="themeToggle" class="theme-toggle">
                <div class="theme-toggle-slider"><i>🌙</i></div>
            </button>
        </header>

        <div id="habitsContainer" class="space-y-4">
            </div>
    </div>

    <script src="/static/index.min.js"></script>
    <script src="/static/overlayscrollbars.browser.es6.min.js"></script>
    <script src="/static/template.js"></script>

    <script>
        // Код для перемикання теми (Dark Mode)
        const btn = document.getElementById('themeToggle');
        btn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        });

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
</body>
</html>
